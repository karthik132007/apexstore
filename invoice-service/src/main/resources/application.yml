server:
  port: 8084
spring:
  application:
    name: invoice-service
  datasource:
    url: ${INVOICE_DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.CockroachDialect
  flyway:
    enabled: true
app:
  jwt-secret: ${JWT_SECRET}
  internal-key: ${INTERNAL_API_KEY}


management:
  endpoints:
    web:
      exposure:
        include: health

